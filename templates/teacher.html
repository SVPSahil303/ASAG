<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <style>
        body {
            background:#f4f4f4;
        }
    </style>
</head>

<body class="bg-light">

<div class="container mt-4">

    <div class="d-flex justify-content-between">
        <h2>👨‍🏫 Teacher Dashboard</h2>
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>

    <hr>

    <!-- ADD QUESTION -->
    <div class="card p-3 shadow mb-4">
        <h4>Add Question</h4>
        <form method="POST">
            <input class="form-control mb-2" type="text" name="question" placeholder="Enter question" required>
            <textarea class="form-control mb-2" name="answer" placeholder="Correct answer" required></textarea>
            <input class="form-control mb-2" type="number" name="marks" value="5">
            <button class="btn btn-success">Add Question</button>
        </form>
    </div>

    <!-- QUESTIONS LIST -->
    <div class="card p-3 shadow mb-4">
    <h4>All Questions</h4>

    {% for q in questions %}
    <div class="d-flex justify-content-between align-items-center border p-2 mb-2 rounded bg-white">
        <div>
            <b>{{ q[1] }}</b><br>
            <small>Marks: {{ q[3] }}</small>
        </div>

        <a href="/delete_question/{{ q[0] }}"
           class="btn btn-danger btn-sm"
           onclick="return confirm('Are you sure you want to delete this question?')">
           Delete
        </a>
    </div>
    {% endfor %}
</div>

    <!-- LEADERBOARD -->
    <div class="card p-3 shadow">
    <h4>Top Students</h4>
    <table class="table">
        <tr>
            <th>Name</th>
            <th>Avg Score</th>
            <th>Actions</th>
        </tr>

        {% for row in leaderboard %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>
                <a href="/student_history/{{ row[0] }}" class="btn btn-info btn-sm">View</a>
                <a href="/download_report_teacher/{{ row[0] }}" class="btn btn-success btn-sm">Download</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</div>

</div>

</body>
</html>
