<!DOCTYPE html>
<html>
<head>
    <title>My Progress</title>
</head>
<body>

<h2>My Performance</h2>

<a href="/student">Back</a> |
<a href="/logout">Logout</a>

<table border="1">
<tr>
<th>Question</th>
<th>Score</th>
<th>Similarity</th>
<th>Feedback</th>
<th>Time</th>
</tr>

{% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}%</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
