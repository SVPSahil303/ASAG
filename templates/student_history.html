<!DOCTYPE html>
<html>
<head>
    <title>Student History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h3>📊 History of {{ username }}</h3>
    <a href="/teacher" class="btn btn-secondary mb-3">Back</a>

    <table class="table table-bordered table-striped">
        <tr>
            <th>Question</th>
            <th>Answer</th>
            <th>Score</th>
            <th>Similarity</th>
            <th>Feedback</th>
            <th>Time</th>
        </tr>

        {% for row in data %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}%</td>
            <td>{{ row[4] }}</td>
            <td>{{ row[5] }}</td>
        </tr>
        {% endfor %}
    </table>

</div>

</body>
</html>
